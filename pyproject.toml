[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-chem"
version = "0.1.0"
description = "ML-driven blowing agent screening via PC-SAFT parameter prediction"
requires-python = ">=3.10"
dependencies = [
    "rdkit",
    "scikit-learn",
    "pandas",
    "numpy",
    "matplotlib",
    "requests",
    "joblib",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["model*", "screening*"]
