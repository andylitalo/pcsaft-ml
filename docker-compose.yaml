services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      PCSAFT_MODEL_TYPE: "${PCSAFT_MODEL_TYPE:-rf}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  portal:
    build:
      context: .
      dockerfile: Dockerfile.portal
    ports:
      - "8501:8501"
    environment:
      PCSAFT_API_URL: "http://api:8000"
    depends_on:
      api:
        condition: service_healthy
