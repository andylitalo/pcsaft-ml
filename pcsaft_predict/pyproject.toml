[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pcsaft-predict"
version = "1.0.0"
description = "Predict PC-SAFT equation-of-state parameters from SMILES"
readme = "README.md"
authors = [
    {name = "ML Chem Project", email = "noreply@example.com"}
]
license = "MIT"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24,<2.0",
    "pandas>=2.0,<3.0",
    "rdkit>=2023.3.1",
    "scikit-learn>=1.3,<2.0",
    "joblib>=1.3,<2.0",
]

[project.optional-dependencies]
thermo = [
    "scipy>=1.11,<2.0",
    "teqp>=0.24.0",
]
dev = [
    "pytest>=7.4",
    "ruff>=0.1",
]

[project.urls]
Homepage = "https://github.com/example/pcsaft-predict"
Repository = "https://github.com/example/pcsaft-predict"

[tool.setuptools]
packages = ["pcsaft_predict"]

[tool.setuptools.package-dir]
pcsaft_predict = "."

[tool.setuptools.package-data]
pcsaft_predict = ["py.typed", "data/.gitkeep"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["../tests"]
python_files = "test_pcsaft_predict.py"
