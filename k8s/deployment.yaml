apiVersion: apps/v1
kind: Deployment
metadata:
  name: pcsaft-api
  namespace: pcsaft
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pcsaft-api
  template:
    metadata:
      labels:
        app: pcsaft-api
    spec:
      containers:
        - name: pcsaft-api
          image: pcsaft-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: pcsaft-config
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - name: submissions
              mountPath: /app/serving/submissions
      volumes:
        - name: submissions
          persistentVolumeClaim:
            claimName: pcsaft-submissions
